# Versions aligned with NewPipe's own build (known to compile together), Nov 2026.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
# Pinned to the commit of tag v0.27.0: JitPack tags can be moved, commits can't.
newpipe-extractor = "7d4d691846acfa3c5af4b2c124955ee4c11cd3e8"
desugar = "2.1.5"
okhttp = "5.5.1"
media3 = "1.11.1"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
coil = "3.6.3"
junit = "4.13.2"
org-json = "20250517"
play-services-auth = "22.0.0"

[libraries]
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipe-extractor" }
android-desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
junit = { module = "junit:junit", version.ref = "junit" }
# Google authorization for device sync (Drive appDataFolder).
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }
# Real org.json for JVM tests (the Android stub returns defaults).
org-json = { module = "org.json:json", version.ref = "org-json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
